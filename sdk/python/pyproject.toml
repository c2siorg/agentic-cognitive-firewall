[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acf-sdk"
version = "0.1.0"
description = "Agentic Cognitive Firewall SDK — Python client"
requires-python = ">=3.10"
dependencies = []  # zero external dependencies — stdlib only

[project.optional-dependencies]
dev = ["pytest>=8"]
scanners = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "scikit-learn>=1.3",
]
# Left unpinned deliberately: the adapter has not been exercised against a real
# Agent Kernel install yet, so no compatible range has been confirmed. Add a
# lower bound once acf.adapters.agent_kernel is smoke-tested against one.
agentkernel = ["agentkernel; python_version >= '3.12'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
